name: Bug report
description: Report a reproducible defect.
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use synthetic data and include the commit, SDK, and host environment. Never include credentials.
    validations:
      required: true
  - type: textarea
    id: model
    attributes:
      label: Model profile if relevant
      description: Provider, model identifier, supported features, and observed failures. Leave credentials out.
