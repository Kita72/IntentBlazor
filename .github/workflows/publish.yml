name: Publish developer preview

on:
  push:
    tags: ['v*-preview.*']

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      INTENT_NUGET_POLICY_CONFIRMED: ${{ vars.INTENT_NUGET_POLICY_CONFIRMED }}
      INTENT_PUBLIC_HOST_VERIFIED: ${{ vars.INTENT_PUBLIC_HOST_VERIFIED }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Validate exact tag and source
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/Assert-ReleaseTag.ps1 -Tag $env:RELEASE_TAG
      - name: Verify repository and packages
        shell: pwsh
        run: ./scripts/Verify.ps1
      - name: Require current release evidence before requesting credentials
        shell: pwsh
        run: ./scripts/Verify-Readiness.ps1 -RequireReady
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: preview-packages
          path: packages
      - name: NuGet login with short-lived OIDC credentials
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish verified packages and symbols
        shell: pwsh
        env:
          NUGET_TOKEN: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($package in Get-ChildItem packages/*.nupkg) {
            dotnet nuget push $package.FullName --api-key $env:NUGET_TOKEN --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw 'Package publication failed; preserve the tag and inspect the failed package.' }
          }
